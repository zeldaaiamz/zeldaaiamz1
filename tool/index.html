<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>工具台 · 关键词作战台</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-page="tool">
  <header class="site-header">
    <a class="brand-link" href="./" aria-label="关键词作战台首页"><span class="brand-mark small">K</span><strong>关键词作战台</strong></a>
    <div class="account-menu"><span id="user-email" class="user-email"></span><button id="logout" class="text-button" type="button">退出登录</button></div>
  </header>

  <main class="page-shell">
    <section class="page-intro">
      <div><p class="eyebrow">CREATE A BATTLE REPORT</p><h1>创建关键词任务</h1><p>输入美国站 ASIN，上传广告搜索词报表，工人会自动生成作战总表。</p></div>
      <div class="status-badge neutral"><i></i>工人每 30 秒检查新任务</div>
    </section>

    <section class="panel submit-panel" aria-labelledby="submit-title">
      <div class="panel-title"><div><p class="step-label">STEP 01</p><h2 id="submit-title">提交资料</h2></div><p>.xlsx / .csv，最大 10 MB</p></div>
      <div id="submit-message" class="message" role="status" hidden></div>
      <form id="task-form" class="task-form" novalidate>
        <div class="task-primary-fields">
          <label class="field asin-field"><span>ASIN</span><input id="asin" name="asin" type="text" maxlength="10" autocapitalize="characters" spellcheck="false" placeholder="例如 B09V366BDY" required><small>10 位，必须以 B0 开头；已有资料会自动带出</small></label>
          <label class="field file-field"><span>广告搜索词报表</span><input id="report-file" name="report" type="file" accept=".xlsx,.csv" required><small id="file-name">尚未选择文件</small></label>
        </div>
        <fieldset class="product-profile-fields">
          <legend>绑定产品资料</legend>
          <p id="profile-status" class="profile-status">输入完整 ASIN 后查询已绑定资料。</p>
          <div class="product-profile-grid">
            <label class="field"><span>产品名称</span><input id="product-name" name="productName" type="text" maxlength="200" placeholder="例如：讲道笔记本" required></label>
            <label class="field"><span>产品标题</span><textarea id="product-title" name="productTitle" rows="3" maxlength="1000" placeholder="粘贴美国站 Listing 完整标题" required></textarea></label>
            <label class="field"><span>产品功能</span><textarea id="product-features" name="productFeatures" rows="4" maxlength="3000" placeholder="每行填写一项已确认功能，或使用分号分隔" required></textarea><small>只写已确认功能，不要猜测。</small></label>
            <label class="field"><span>产品场景</span><textarea id="product-scenes" name="productScenes" rows="4" maxlength="3000" placeholder="每行填写一个常用场景，或使用分号分隔" required></textarea><small>豆包只根据这里的场景做关联判断。</small></label>
          </div>
        </fieldset>
        <button id="task-submit" class="primary-button submit-task" type="submit">提交任务</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="tasks-title">
      <div class="panel-title task-list-title"><div><p class="step-label">STEP 02</p><h2 id="tasks-title">我的最近任务</h2></div><button id="refresh-tasks" class="secondary-button" type="button">刷新任务</button></div>
      <div id="tasks-message" class="message" role="status" hidden></div>
      <div class="table-scroll">
        <table class="task-table">
          <thead><tr><th>提交时间</th><th>ASIN</th><th>状态</th><th>失败原因</th><th>报告</th></tr></thead>
          <tbody id="tasks-body"><tr><td colspan="5" class="empty-cell">正在加载任务…</td></tr></tbody>
        </table>
      </div>
      <p class="refresh-note">页面每 30 秒自动刷新，也可以手动刷新。</p>
    </section>
  </main>

  <script src="../assets/vendor/supabase.js"></script>
  <script src="../assets/config.js"></script>
  <script src="../assets/app.js"></script>
</body>
</html>
