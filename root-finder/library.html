<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赛道库 · Root Finder</title><link rel="stylesheet" href="library.css?v=bulk-1"></head><body><main class="shell">
<header><a href="./" class="brand">↗ ROOT FINDER</a><div class="header-tools"><input id="search" type="search" placeholder="搜索赛道或备注" aria-label="搜索赛道或备注"><a href="./" class="button">返回词根选品</a></div></header>
<section class="hero"><p class="eyebrow">YOUR CURATED MARKETS</p><h1>赛道库</h1><p>按主题整理值得继续研究的赛道，记录你的判断。</p></section>
<div id="notice" role="status" class="notice"></div><p id="error" role="alert"></p>
<div class="layout"><aside><h2>主题</h2><nav id="topics" aria-label="赛道主题"></nav></aside><section><div class="toolbar"><div><h2 id="title">全部赛道</h2><p id="count"></p></div><button id="refresh" class="button">刷新</button></div><div class="filters"><select id="method" aria-label="筛选方法"><option value="">全部筛选方法</option></select></div><div class="bulk-toolbar"><label><input id="selectAll" type="checkbox"> 全选当前筛选结果</label><span id="selectionCount">已选 0 条</span><button id="bulkDelete" class="danger" disabled>删除所选</button></div><div id="lanes"><p>正在读取赛道库…</p></div></section></div>
</main><dialog id="loginDialog"><form id="loginForm"><h2>登录赛道库</h2><p>使用词根选品的同一个密码。</p><label for="password">登录密码</label><input id="password" type="password" autocomplete="current-password" required><p id="loginError" role="alert"></p><button class="primary">登录</button></form></dialog><script src="api-config.js"></script><script src="library.js?v=dual-1"></script></body></html>
